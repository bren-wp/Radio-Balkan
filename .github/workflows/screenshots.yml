name: Product screenshots

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - apps/windows/**
      - extensions/shared/**
      - assets/brand/**
      - scripts/capture-windows.ps1
      - scripts/validate-screenshot.ps1
      - scripts/browser-screenshot-runtime.js
      - scripts/check_clean_worktree.py
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build Windows application
        shell: pwsh
        working-directory: apps/windows
        run: ./build-release.ps1 -Version (Get-Content ../../VERSION).Trim()
      - name: Verify screenshot build leaves repository clean
        run: python scripts/check_clean_worktree.py
      - name: Capture real Windows UI
        shell: pwsh
        run: ./scripts/capture-windows.ps1 -Exe "apps/windows/dist/RadioBalkan-Portable-v$((Get-Content VERSION).Trim()).exe" -Output "assets/screenshots/windows.png"
      - name: Capture production browser popup UI
        shell: pwsh
        run: |
          $preview = Join-Path $env:RUNNER_TEMP 'radio-balkan-popup-preview'
          if (Test-Path $preview) { Remove-Item $preview -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $preview | Out-Null
          Copy-Item 'extensions/shared/*' $preview -Force
          Copy-Item 'scripts/browser-screenshot-runtime.js' (Join-Path $preview 'browser-screenshot-runtime.js') -Force
          $popupPath = Join-Path $preview 'popup.html'
          $popup = Get-Content $popupPath -Raw
          $needle = '<script src="network.js"></script>'
          if (-not $popup.Contains($needle)) { throw 'Browser popup script anchor was not found.' }
          $popup = $popup.Replace($needle, '<script src="browser-screenshot-runtime.js"></script>' + [Environment]::NewLine + '  ' + $needle)
          Set-Content -Path $popupPath -Value $popup -Encoding UTF8

          $server = Start-Process python -ArgumentList '-m','http.server','8765','--directory',"`"$preview`"" -PassThru -WindowStyle Hidden
          $process = $null
          try {
            Start-Sleep -Seconds 2
            $candidates = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
              "$env:LOCALAPPDATA\Microsoft\Edge\Application\msedge.exe"
            )
            $browser = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if (-not $browser) {
              foreach ($name in @('chrome.exe','msedge.exe')) {
                $cmd = Get-Command $name -ErrorAction SilentlyContinue
                if ($cmd) { $browser = $cmd.Source; break }
              }
            }
            if (-not $browser) { throw 'Edge/Chrome executable was not found on the GitHub runner.' }

            $output = Join-Path $PWD 'assets\screenshots\browser-extension.png'
            $profile = Join-Path $env:RUNNER_TEMP 'radio-balkan-browser-profile'
            if (Test-Path $profile) { Remove-Item $profile -Recurse -Force }
            New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null
            $args = @(
              '--headless=new',
              '--disable-gpu',
              '--disable-background-networking',
              '--no-first-run',
              '--no-default-browser-check',
              "--user-data-dir=$profile",
              '--window-size=420,600',
              '--hide-scrollbars',
              "--screenshot=$output",
              'http://127.0.0.1:8765/popup.html'
            )
            $process = Start-Process -FilePath $browser -ArgumentList $args -PassThru
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Headless browser screenshot timed out after 30 seconds.'
            }
            if ($process.ExitCode -ne 0) { throw "Headless browser exited with code $($process.ExitCode)." }
            if (-not (Test-Path $output)) { throw 'Browser screenshot was not created.' }
            if ((Get-Item $output).Length -lt 1024) { throw 'Browser screenshot is unexpectedly small.' }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Get-Process msedge,chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (Test-Path $preview) { Remove-Item $preview -Recurse -Force -ErrorAction SilentlyContinue }
          }
      - name: Validate screenshot visual content
        shell: pwsh
        run: |
          $screenshots = @(
            'assets/screenshots/windows.png',
            'assets/screenshots/browser-extension.png'
          )
          ./scripts/validate-screenshot.ps1 -Path $screenshots
      - name: Commit screenshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/*.png
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "docs: refresh Radio Balkan application screenshots"
          git push origin HEAD:${{ github.ref_name }}
