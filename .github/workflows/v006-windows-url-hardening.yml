name: v0.0.6 Windows URL hardening

on:
  push:
    branches: ["chatgpt/v0.0.6-production"]
    paths: [".github/workflows/v006-windows-url-hardening.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.0.6-production
          fetch-depth: 0
      - name: Reject credentialed stream URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/windows/portable/main.go')
          text = path.read_text(encoding='utf-8')
          old = '''\tu, err := url.Parse(raw)\n\tif err != nil || u == nil {\n\t\treturn false\n\t}\n\tif u.Scheme != "http" && u.Scheme != "https" {\n'''
          new = '''\tu, err := url.Parse(raw)\n\tif err != nil || u == nil {\n\t\treturn false\n\t}\n\tif u.User != nil {\n\t\treturn false\n\t}\n\tif u.Scheme != "http" && u.Scheme != "https" {\n'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('safeHTTPURL marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows/portable/main.go
          git diff --cached --quiet && exit 0
          git commit -m "fix(windows): reject credentialed stream URLs"
          git push origin HEAD:chatgpt/v0.0.6-production
