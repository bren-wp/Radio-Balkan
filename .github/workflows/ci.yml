name: CI

on:
  push:
    branches: [main, "release/**", "chatgpt/**"]
    paths-ignore:
      - "assets/screenshots/**"
  pull_request:
    paths-ignore:
      - "assets/screenshots/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check synchronized versions
        run: python scripts/check_versions.py
      - name: Verify security contracts
        run: python scripts/verify_security_contracts.py
      - name: Test live-radio pinned network boundary
        run: python scripts/test_live_radio_security.py
      - name: Verify production UI contracts
        run: python scripts/verify_production_ui.py
      - name: Test release checksum manifest
        run: python scripts/test_release_checksums.py
      - name: Test version tooling transactions
        run: python scripts/test_version_tools.py
      - name: Validate next version bump dry-run
        shell: bash
        run: |
          NEXT_VERSION=$(python -c "parts=list(map(int, open('VERSION', encoding='utf-8').read().strip().split('.'))); parts[2]+=1; print('.'.join(map(str, parts)))")
          python scripts/bump_version.py "$NEXT_VERSION" --dry-run

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check extensions/shared/network.js
          node --check extensions/shared/catalog.js
          node --check extensions/shared/popup.js
          node --check extensions/platform/chromium/service_worker.js
          node --check extensions/platform/chromium/offscreen.js
          node --check extensions/platform/firefox/background-firefox.js
          node --check scripts/browser-screenshot-runtime.js
          node --check scripts/test_browser_network_contract.js
          node --check scripts/test_browser_catalog_contract.js
          node --check scripts/test_browser_state_contract.js
          node --check scripts/test_chromium_player_contract.js
          node --check scripts/test_chromium_offscreen_contract.js
          node --check scripts/test_firefox_player_contract.js
      - name: Test browser network safety contract
        run: node scripts/test_browser_network_contract.js
      - name: Test browser catalog discovery contract
        run: node scripts/test_browser_catalog_contract.js
      - name: Test browser player state contract
        run: node scripts/test_browser_state_contract.js
      - name: Test Chromium player close/session contract
        run: node scripts/test_chromium_player_contract.js
      - name: Test Chromium offscreen timeout/stall contract
        run: node scripts/test_chromium_offscreen_contract.js
      - name: Test Firefox player timeout/stall/session contract
        run: node scripts/test_firefox_player_contract.js
      - name: Build extensions
        working-directory: extensions
        run: python tools/build_extensions.py
      - name: Verify browser build leaves repository clean
        run: python scripts/check_clean_worktree.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell tooling
        shell: pwsh
        run: |
          foreach ($path in @('scripts/capture-windows.ps1', 'scripts/test-windows-runtime.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$path contains PowerShell syntax errors."
            }
          }
      - name: Test and build Windows release
        working-directory: apps/windows
        shell: pwsh
        run: ./build-release.ps1 -Version (Get-Content ../../VERSION).Trim()
      - name: Soak-test Windows startup runtime
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          ./scripts/test-windows-runtime.ps1 -Exe "apps/windows/dist/RadioBalkan-Portable-v$version.exe" -SoakSeconds 15
      - name: Test real Balkan live-stream transport
        run: python scripts/test_live_radio_streams.py
      - name: Verify Windows build leaves repository clean
        run: python scripts/check_clean_worktree.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 36 build components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses >/dev/null) || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Android unit tests, lint and release build
        working-directory: apps/android
        run: gradle --no-daemon --console=plain testReleaseUnitTest lintRelease assembleRelease
      - name: Verify Android build leaves repository clean
        run: python scripts/check_clean_worktree.py
