name: v0.0.6 CI queue cleanup

on:
  push:
    branches: ["chatgpt/v0.0.6-production"]
    paths: [".github/workflows/v006-ci-cleanup.yml"]

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale CI runs from v0.0.6 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=chatgpt%2Fv0.0.6-production&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "CI" and (.status == "queued" or .status == "in_progress")) | .id' \
          | while read -r run_id; do
              [ -z "$run_id" ] && continue
              echo "Cancelling stale CI run ${run_id}"
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
            done
