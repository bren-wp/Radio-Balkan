name: Publish GitHub release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release_check:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: release
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')
          fi
          PUBLISH=false
          if [ -z "$TAG_SHA" ]; then
            PUBLISH=true
          elif [ "$TAG_SHA" = "$TARGET_SHA" ]; then
            PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" != "true" ]; then
            echo "VERSION ${VERSION} already belongs to ${TAG_SHA}; this main commit is not a release bump."
          fi

  windows:
    needs: release_check
    if: needs.release_check.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_check.outputs.sha }}
      - name: Import Windows code-signing certificate and build signed release
        working-directory: apps/windows
        shell: pwsh
        env:
          WINDOWS_PFX_B64: ${{ secrets.RADIO_BALKAN_WINDOWS_PFX_B64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.RADIO_BALKAN_WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            throw "Public Windows releases require RADIO_BALKAN_WINDOWS_PFX_B64 and RADIO_BALKAN_WINDOWS_PFX_PASSWORD."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "radio-balkan-signing.pfx"
          $securePassword = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_B64))
          $cert = $null
          try {
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword -Exportable:$false
            if (-not $cert -or [string]::IsNullOrWhiteSpace($cert.Thumbprint)) {
              throw "Code-signing certificate import failed."
            }
            $codeSigningEku = $cert.EnhancedKeyUsageList | Where-Object { $_.ObjectId.Value -eq "1.3.6.1.5.5.7.3.3" }
            if (-not $codeSigningEku) {
              throw "Imported certificate is not valid for Code Signing."
            }

            ./build-release.ps1 -Version (Get-Content ../../VERSION).Trim() -SigningThumbprint $cert.Thumbprint -RequireSignature
          } finally {
            if ($cert -and $cert.Thumbprint) {
              Remove-Item ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
            }
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Verify published Windows artifacts are Authenticode-signed
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          foreach ($path in @(
            "apps/windows/dist/RadioBalkan-Portable-v$version.exe",
            "apps/windows/dist/RadioBalkan-Setup-v$version.exe"
          )) {
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "$path is not signed with a valid Authenticode signature: $($signature.Status)"
            }
          }
      - name: Soak-test built Windows release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          ./scripts/test-windows-runtime.ps1 -Exe "apps/windows/dist/RadioBalkan-Portable-v$version.exe" -SoakSeconds 15
      - name: Verify Windows build leaves repository clean
        run: python scripts/check_clean_worktree.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/windows/dist/*

  browsers:
    needs: release_check
    if: needs.release_check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_check.outputs.sha }}
      - working-directory: extensions
        run: python tools/build_extensions.py
      - name: Verify browser build leaves repository clean
        run: python scripts/check_clean_worktree.py
      - uses: actions/upload-artifact@v4
        with:
          name: browsers
          path: extensions/dist/*.zip

  android:
    needs: release_check
    if: needs.release_check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_check.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 36 build components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses >/dev/null) || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Prepare optional release signing
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.RADIO_BALKAN_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RADIO_BALKAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RADIO_BALKAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RADIO_BALKAN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Android signing is partially configured. Configure all four RADIO_BALKAN signing secrets or none of them."
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 --decode > radio-balkan-release.jks
            echo "RADIO_BALKAN_KEYSTORE=$PWD/radio-balkan-release.jks" >> "$GITHUB_ENV"
            echo "RADIO_BALKAN_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RADIO_BALKAN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RADIO_BALKAN_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Test and build Android release
        working-directory: apps/android
        run: gradle --no-daemon --console=plain testReleaseUnitTest lintRelease assembleRelease
      - name: Normalize Android artifact name
        working-directory: apps/android
        run: |
          VERSION=$(cat ../../VERSION)
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          if echo "$APK" | grep -q 'unsigned'; then
            cp "$APK" "dist/RadioBalkan-Android-v${VERSION}-unsigned.apk"
          else
            cp "$APK" "dist/RadioBalkan-Android-v${VERSION}.apk"
          fi
      - name: Verify Android build leaves repository clean
        run: python scripts/check_clean_worktree.py
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/android/dist/*.apk
      - name: Remove signing material
        if: always()
        working-directory: apps/android
        run: rm -f radio-balkan-release.jks

  release:
    needs: [release_check, windows, browsers, android]
    if: >-
      always() &&
      needs.release_check.outputs.publish == 'true' &&
      needs.windows.result == 'success' &&
      needs.browsers.result == 'success' &&
      needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_check.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate and verify checksums
        run: |
          VERSION=$(cat VERSION)
          python scripts/generate_release_checksums.py release-assets "$VERSION"
          cd release-assets
          sha256sum -c "RadioBalkan-v${VERSION}-SHA256.txt"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.release_check.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')
          fi
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$TARGET_SHA" ]; then
            echo "::error::${TAG} already points to ${TAG_SHA}; refusing to publish a different commit."
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$TARGET_SHA" --title "Radio Balkan ${TAG}" --notes "Produkcijsko izdanje Radio Balkan ${TAG}. Detalji: docs/RELEASES.md"
          fi
          gh release upload "$TAG" release-assets/* --clobber
