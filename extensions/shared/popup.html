<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Radio Balkan</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app" aria-label="Radio Balkan">
    <header class="topbar">
      <div class="brand">
        <img src="icon48.png" alt="" width="40" height="40">
        <div class="brandCopy">
          <strong>Radio Balkan</strong>
          <span>Balkan + 50 stranih · radio uživo</span>
        </div>
      </div>
      <button id="refresh" class="iconButton" type="button" aria-label="Osvježi katalog" title="Osvježi katalog">↻</button>
    </header>

    <section class="hero" aria-labelledby="heroName">
      <div class="heroCopy">
        <span class="liveBadge"><i></i> UŽIVO</span>
        <h1 id="heroName">Odaberi stanicu</h1>
        <p id="heroMeta">Radio iz regije i odabrane svjetske postaje</p>
      </div>
      <button id="heroPlay" class="primaryButton" type="button" disabled>▶ Slušaj</button>
    </section>

    <section class="tools" aria-label="Pretraživanje i filtriranje">
      <label class="searchField" aria-label="Pretraži radio stanice">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Pretraži naziv, grad, žanr ili zemlju…" autocomplete="off" spellcheck="false">
      </label>
      <label class="selectField">
        <span>Područje</span>
        <select id="country" aria-label="Filtriraj po području">
          <option value="">Sve postaje</option>
        </select>
      </label>
      <label class="selectField">
        <span>Kategorija</span>
        <select id="genre" aria-label="Filtriraj po kategoriji">
          <option value="">Sve kategorije</option>
          <option value="domaca">Domaća / regionalna</option>
          <option value="pop">Pop &amp; Rock</option>
          <option value="folk">Narodna / Folk</option>
          <option value="electronic">Elektronička</option>
          <option value="jazz">Jazz</option>
          <option value="classical">Klasična</option>
          <option value="news">Vijesti &amp; Talk</option>
          <option value="hits">Hits / Top 40</option>
          <option value="oldies">Oldies</option>
        </select>
      </label>
    </section>

    <div class="summary">
      <span id="status" role="status" aria-live="polite">Učitavam provjerene postaje…</span>
      <div class="summaryActions">
        <button id="clearFilters" class="textButton subtleButton" type="button" hidden>Očisti</button>
        <button id="favoritesOnly" class="textButton" type="button" aria-pressed="false">♡ Omiljene</button>
      </div>
    </div>

    <section id="stations" class="stations" role="list" aria-label="Radio stanice"></section>

    <footer class="player" aria-label="Reprodukcija">
      <img id="playerLogo" src="icon48.png" alt="" width="52" height="52" referrerpolicy="no-referrer">
      <div class="playerCopy">
        <small id="playerState" role="status" aria-live="polite">Spremno</small>
        <strong id="playerName">Nije odabrano</strong>
        <span id="playerMeta">Odaberi stanicu</span>
      </div>
      <button id="playerFav" class="playerIcon" type="button" aria-label="Dodaj u omiljene" aria-pressed="false" disabled>♡</button>
      <div class="playerTransport" role="group" aria-label="Kontrole reprodukcije">
        <button id="playerPrev" class="transportButton" type="button" aria-label="Prethodna stanica" disabled>◀</button>
        <button id="playerStop" class="transportButton" type="button" aria-label="Zaustavi reprodukciju" disabled>■</button>
        <button id="playerToggle" class="roundPlay" type="button" aria-label="Pokreni" disabled>▶</button>
        <button id="playerNext" class="transportButton" type="button" aria-label="Sljedeća stanica" disabled>▶</button>
      </div>
    </footer>
  </main>
  <script src="network.js"></script>
  <script src="catalog.js"></script>
  <script src="popup.js"></script>
</body>
</html>
